input:focus{border-color:#1d6bd8}
button{background:#1d6bd8;border:none;color:#fff;font-family:"Outfit",sans-serif;font-size:14px;font-weight:600;padding:11px;border-radius:9px;cursor:pointer;margin-top:4px}
button:hover{background:#3b8ef0}button:disabled{opacity:.6;cursor:wait}
