// ═══ CRIPTOGRAFIA (AES-256-GCM + PBKDF2) ═══
var PX = (function () {
  var te = new TextEncoder(), td = new TextDecoder();
  function b64(buf) { var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }

  function rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function normUser(u) { return String(u || '').trim().toLowerCase(); }
  async function uid(u) { var h = await crypto.subtle.digest('SHA-256', te.encode('ponto-almd|' + normUser(u))); return b64(h).slice(0, 22); }
  async function kek(user, pass, salt, iter) {
    var km = await crypto.subtle.importKey('raw', te.encode(normUser(user) + '\n' + pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: iter }, km, 256));
  }
  async function enc(raw, data) {
    var iv = rnd(12), k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
    return { iv: b64(iv), c: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, data)) };
  }
  async function dec(raw, o) {
    var k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(o.iv) }, k, ub64(o.c)));
  }
  async function mkRec(user, name, role, pass, iter) {
    var salt = rnd(16), k = await kek(user, pass, salt, iter);
    return { user: normUser(user), name: name, role: role, salt: b64(salt), kek: b64(k) };
  }
  // Gera o arquivo protegido: chave nova a cada geração
  async function build(appHtml, recs, shell, iter) {
    var cek = rnd(32), ak = rnd(32), users = [];
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i], w = { cek: b64(cek), user: r.user, name: r.name, role: r.role };
      if (r.role === 'admin') w.ak = b64(ak);
      var e = await enc(ub64(r.kek), te.encode(JSON.stringify(w)));
      users.push({ id: await uid(r.user), salt: r.salt, iv: e.iv, c: e.c });
    }
    users.sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    var data = { v: 1, iter: iter, users: users, adm: await enc(ak, te.encode(JSON.stringify(recs))), app: await enc(cek, te.encode(appHtml)) };
    return shell.split('__PX' + 'DATA__').join(JSON.stringify(data));
  }
  return { b64: b64, ub64: ub64, uid: uid, kek: kek, enc: enc, dec: dec, mkRec: mkRec, build: build, normUser: normUser,
    str: function (u) { return td.decode(u); }, bytes: function (s) { return te.encode(s); } };
})();

      var id = await PX.uid(u), e = null;
      for (var i = 0; i < PXD.users.length; i++) if (PXD.users[i].id === id) e = PXD.users[i];
      // usuário inexistente gasta o mesmo tempo
      var k = await PX.kek(u, p, PX.ub64(e ? e.salt : 'AAAAAAAAAAAAAAAAAAAAAA=='), PXD.iter);
      if (!e) throw 0;
      var w = JSON.parse(PX.str(await PX.dec(k, e)));
      var html = PX.str(await PX.dec(PX.ub64(w.cek), PXD.app));
      window.__AUTH = { user: w.user, name: w.name, role: w.role, ak: w.ak || null, adm: PXD.adm, iter: PXD.iter, app: html };
      document.open(); document.write(html); document.close();
    } catch (x) { fail(); }
  });
})();
</script>
</body>
</html>
